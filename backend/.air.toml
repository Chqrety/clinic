# Config file for Air (Go Live Reload)
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "bin", "docs", "tests"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "sql"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true
  send_interrupt = false

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

