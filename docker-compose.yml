services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clinic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic_secret}
      POSTGRES_DB: ${DB_NAME:-clinic_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinic} -d ${DB_NAME:-clinic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clinic_pgdata:
